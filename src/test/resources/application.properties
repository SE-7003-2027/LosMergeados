# Base de datos H2 exclusiva para pruebas
spring.datasource.url=jdbc:h2:mem:recomendador_test;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea el esquema temporalmente
spring.jpa.hibernate.ddl-auto=create-drop

# Las pruebas no ejecutan migraciones de PostgreSQL
spring.flyway.enabled=false

# Evitar ruido innecesario
spring.jpa.show-sql=false
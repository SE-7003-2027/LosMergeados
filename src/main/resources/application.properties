# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=recomendador

# Errores con formato estándar (RFC 9457 / Problem Details) y sin exponer
# información interna del servidor (ver RFC del proyecto, sección "Manejo de errores").
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Documentación interactiva de la API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

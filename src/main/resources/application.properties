# Puerto del servidor
server.port=8080

# Nombre de la aplicación
spring.application.name=recomendador

# Errores con formato estándar (RFC 9457 / Problem Details) y sin exponer
# información interna del servidor (ver RFC del proyecto, sección "Manejo de errores").
spring.mvc.problemdetails.enabled=true
server.error.include-stacktrace=never

# Documentación interactiva de la API
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Flyway: migraciones de la base de datos
spring.flyway.enabled=true

